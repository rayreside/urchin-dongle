manifest:
  remotes:
    # zmk official
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      # bravekarma
    - name: caksoylar
      url-base: https://github.com/caksoylar
      # kyek / duckyb
    - name: duckyb
      url-base: https://github.com/duckyb
      # nice!view gem
    - name: m165437
      url-base: https://github.com/M165437
      # prospector
    - name: janpfischer
      url-base: https://github.com/janpfischer
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: urchin-zmk-module
      remote: duckyb
      revision: main
    - name: nice-view-gem
      remote: m165437
      revision: main
    - name: zmk-dongle-screen
      remote: janpfischer
      # main is LVGL 8 / ZMK 0.3.0 and does not build against ZMK main
      # (Zephyr 4.1 + LVGL 9). upgrade-4.1 is the branch for it.
      revision: upgrade-4.1
  self:
    path: config