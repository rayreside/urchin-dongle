# increase bluetooth signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# enable deep sleep support
# CONFIG_ZMK_SLEEP=y

# the keyboard disconnects from bluetooth.
# uses very little power, but it may take
# a few seconds to reconnect after waking.
# 1.800.000 ms = 30 minutes
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# "Eager Debouncing"
# Trying to lower the input lag.
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --- DISPLAY SETTINGS ---

# disable the WPM widget
#CONFIG_ZMK_WIDGET_WPM_STATUS=n
# display battery as n%
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n
CONFIG_DONGLE_SCREEN_SYSTEM_ICON=2
CONFIG_DONGLE_SCREEN_IDLE_TIMEOUT_S=0

# Animated eyes in place of the layer label.
# The eyes read the layer themselves, so the text label goes.
CONFIG_DONGLE_SCREEN_EYES_ACTIVE=y
CONFIG_DONGLE_SCREEN_LAYER_ACTIVE=n

# WPM still feeds the eyes (ZMK_WPM stays selected by the custom status
# screen) - this only drops the on-screen number.
CONFIG_DONGLE_SCREEN_WPM_ACTIVE=n

# Modifier glyphs never earned their space.
CONFIG_DONGLE_SCREEN_MODIFIER_ACTIVE=n

# The eyes go sleepy on ZMK's idle state, and 30s (the default) was far too
# eager. 10 minutes. The dongle is USB powered, so nothing is saved by
# dropping to idle sooner.
CONFIG_ZMK_IDLE_TIMEOUT=600000

# LVGL's draw buffer, as a percentage of the display, double buffered.
# YADS defaults this to 50, which on a 240x280 16bpp panel is
# 240*280*0.5*2 bytes *2 buffers = 134KB - over half the RAM on the chip, and
# the reason this build sat at 91% RAM before anything was added to it. 24%
# gives back roughly 68KB.
#
# The trade is render throughput: a smaller buffer means more flushes per
# frame. LV_Z_FLUSH_THREAD is on, so flushing overlaps with drawing and this
# is usually invisible. Raise it if the screen tears or lags.
CONFIG_LV_Z_VDB_SIZE=24

# Frame rate. LVGL only redraws when this many ms have elapsed, but it only
# ever checks when ZMK services it - every ZMK_DISPLAY_TICK_PERIOD_MS, which
# is 10. So the period is effectively rounded up to a multiple of 10, and the
# achievable rates are 1000/(10*n): 50, 33, 25, 20 and so on.
#
# 80ms is 12.5fps, the nearest reachable to 12. Chosen for the look of
# limited animation, and it halves the redraw work at the same time.
#
# Animations still step every 10ms - only drawing is throttled - so short
# ones simply get sampled coarsely rather than played out. Anything briefer
# than 80ms risks falling between two redraws and never being seen at all,
# which is why the blink's closing phase is a full frame long.
CONFIG_LV_DEF_REFR_PERIOD=80